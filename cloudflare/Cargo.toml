[package]
name = "vaultwarden-worker"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
url = "2"

[profile.release]
lto = true
opt-level = "s"
# wasm-bindgen >=0.2.125 needs the externref table retained until binding generation.
strip = false
